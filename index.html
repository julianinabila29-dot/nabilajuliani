
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Nabila Nasa Juliani</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e0e7ff, #f8fafc);
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .biodata-card {
            max-width: 500px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header-card {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 35px 20px;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: white;
            color: #4f46e5;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            margin: 0 auto 15px;
        }

        .info-label {
            color: #64748b;
            font-size: 14px;
        }

        .info-value {
            font-weight: bold;
            color: #1e293b;
        }

        .btn-custom {
            background: #4f46e5;
            color: white;
            border-radius: 10px;
        }

        .btn-custom:hover {
            background: #3730a3;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Biodata Mahasiswa
            </a>
        </div>
    </nav>

    <!-- Konten Biodata -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">

                <div class="card biodata-card mx-auto">

                    <!-- Header -->
                    <div class="header-card text-center">
                        <div class="profile-icon">
                            👩🏻‍🎓
                        </div>

                        <h3 class="fw-bold">
                            Nabila Nasa Juliani
                        </h3>

                        <p class="mb-0">
                            Mahasiswa
                        </p>
                    </div>

                    <!-- Isi Biodata -->
                    <div class="card-body p-4">

                        <h5 class="fw-bold mb-4 text-primary">
                            Informasi Biodata
                        </h5>

                        <div class="row mb-3">
                            <div class="col-5 info-label">
                                Nama Lengkap
                            </div>
                            <div class="col-7 info-value">
                                Nabila Nasa Juliani
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-3">
                            <div class="col-5 info-label">
                                Program Studi
                            </div>
                            <div class="col-7 info-value">
                                Komputerisasi Akuntansi
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-3">
                            <div class="col-5 info-label">
                                Semester
                            </div>
                            <div class="col-7 info-value">
                                Semester 1
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-3">
                            <div class="col-5 info-label">
                                Status
                            </div>
                            <div class="col-7">
                                <span class="badge bg-success">
                                    Mahasiswa Aktif
                                </span>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button class="btn btn-custom py-2"
                                    onclick="alert('Terima kasih telah mengunjungi biodata saya!')">
                                Tentang Saya
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Footer -->
                <p class="text-center text-secondary mt-4 small">
                    &copy; 2026 Nabila Nasa Juliani
                </p>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
